<!doctype html>
<html lang="ko"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카메라 선명도 비교</title>
<style>
body{margin:0;background:#111820;color:#e8eef5;font:16px system-ui;padding:20px}a{color:#8ccaff}
header,.controls{display:flex;gap:16px;align-items:center;flex-wrap:wrap}h1{font-size:22px}p{color:#b9c5d2;line-height:1.6}
button,select{font:inherit;padding:8px;background:#263747;color:white;border:1px solid #607080;border-radius:6px}
.views{display:grid;grid-template-columns:1fr 1fr;gap:16px}section{min-width:0}h2{font-size:16px}
.viewport{overflow:auto;max-height:70vh;border:1px solid #425466;background:black}canvas{display:block;width:100%;height:auto}
.native canvas{width:auto;max-width:none}label{display:flex;align-items:center;gap:8px}#status{min-height:1.5em}
@media(max-width:700px){.views{grid-template-columns:1fr}}
</style>
<header><h1>카메라 선명도 비교</h1><a href="/">대시보드</a></header>
<p>같은 수신 프레임의 원본과 윤곽 보정을 비교합니다. 보정은 초점을 움직이거나 사라진 글자·나사 디테일을 복원하지 않습니다.</p>
<div class="controls">
<label>보정 강도 <input id="amount" type="range" min="0" max="3" step="0.25" value="1.5"><output id="level">1.5</output></label>
<label>보기 <select id="scale"><option value="fit">화면에 맞춤</option><option value="native">원본 크기 · 스크롤</option></select></label>
<button id="pause">화면 일시정지</button>
</div>
<p id="status" role="status">프레임 수신 중…</p>
<div class="views" id="views">
<section><h2>원본</h2><div class="viewport"><canvas id="original" aria-label="원본 카메라 영상"></canvas></div></section>
<section><h2>윤곽 보정 · 화면 표시용</h2><div class="viewport"><canvas id="enhanced" aria-label="윤곽 보정 영상"></canvas></div></section>
</div>
<script>
'use strict';
const original=document.getElementById('original'),enhanced=document.getElementById('enhanced');
const src=original.getContext('2d',{willReadFrequently:true}),dst=enhanced.getContext('2d');
const amount=document.getElementById('amount'),status=document.getElementById('status');
let pixels=null,blurred=null,paused=false,lastVersion=null,lastReceivedAt=0;
// Separable box blur provides the low-frequency component of unsharp masking.
// Work is browser-side; originals and device inference inputs are untouched.
function blurRGB(data,w,h,r=4){
 const tmp=new Float32Array(w*h*3),out=new Float32Array(w*h*3),n=2*r+1;
 for(let y=0;y<h;y++)for(let c=0;c<3;c++){
  let sum=0;for(let k=-r;k<=r;k++)sum+=data[(y*w+Math.max(0,Math.min(w-1,k)))*4+c];
  for(let x=0;x<w;x++){
   tmp[(y*w+x)*3+c]=sum/n;
   sum+=data[(y*w+Math.min(w-1,x+r+1))*4+c]-data[(y*w+Math.max(0,x-r))*4+c];
  }
 }
 for(let x=0;x<w;x++)for(let c=0;c<3;c++){
  let sum=0;for(let k=-r;k<=r;k++)sum+=tmp[(Math.max(0,Math.min(h-1,k))*w+x)*3+c];
  for(let y=0;y<h;y++){
   out[(y*w+x)*3+c]=sum/n;
   sum+=tmp[(Math.min(h-1,y+r+1)*w+x)*3+c]-tmp[(Math.max(0,y-r)*w+x)*3+c];
  }
 }
 return out;
}
function render(){
 document.getElementById('level').value=amount.value;
 if(!pixels)return;
 const result=new ImageData(new Uint8ClampedArray(pixels.data),pixels.width,pixels.height),a=Number(amount.value);
 for(let i=0,j=0;i<result.data.length;i+=4,j+=3)for(let c=0;c<3;c++){
  const d=pixels.data[i+c]-blurred[j+c];
  // Small differences are left alone to avoid emphasizing low-level noise.
  result.data[i+c]=pixels.data[i+c]+(Math.abs(d)>3?a*d:0);
 }
 dst.putImageData(result,0,0);
}
amount.oninput=render;
document.getElementById('scale').onchange=e=>document.getElementById('views').classList.toggle('native',e.target.value==='native');
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'실시간 재개':'화면 일시정지';if(paused)status.textContent='화면 일시정지 · 마지막 프레임 표시 중';};
async function poll(){
 try{
  if(paused||document.hidden)return;
  const meta=await fetch('/api/research',{cache:'no-store',signal:AbortSignal.timeout(5000)});
  if(meta.status===401){status.innerHTML='로그인이 필요합니다. <a href="/login">로그인</a>';return;}
  if(!meta.ok)throw new Error('상태 수신 실패');
  const info=await meta.json(),camera=info.camera||{};
  if(camera.version==null)throw new Error('카메라 프레임 없음');
  if(lastVersion!==camera.version){
   const response=await fetch('/frame.jpg?v='+encodeURIComponent(camera.version),{cache:'no-store',signal:AbortSignal.timeout(5000)});
   if(!response.ok||!(response.headers.get('Content-Type')||'').startsWith('image/'))throw new Error('영상 수신 실패');
   const bitmap=await createImageBitmap(await response.blob());
   if(paused||document.hidden){bitmap.close();return;}
   original.width=enhanced.width=bitmap.width;original.height=enhanced.height=bitmap.height;
   src.drawImage(bitmap,0,0);bitmap.close();
   pixels=src.getImageData(0,0,original.width,original.height);
   blurred=blurRGB(pixels.data,pixels.width,pixels.height);render();lastVersion=camera.version;lastReceivedAt=Date.now();
  }
  if(!paused)status.textContent=`${original.width} × ${original.height} · 카메라 갱신 ${camera.age_s}초 전 · 표시 프레임 ${new Date(lastReceivedAt).toLocaleTimeString()}`;
 }catch(e){status.textContent='수신 확인 필요 · '+e.message+' · 마지막 화면 유지';}
 finally{setTimeout(poll,800);}
}
poll();
</script></html>
